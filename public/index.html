<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECOMILE Dashboard</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #617083;
        --line: #dde3ea;
        --ok: #168a4a;
        --warn: #b26b00;
        --err: #c92a2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0;
      }

      header {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 28px;
        margin: 0;
      }

      select,
      input {
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        min-height: 38px;
        padding: 6px 10px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .status {
        border-radius: 999px;
        color: #fff;
        font-weight: 700;
        min-width: 76px;
        padding: 8px 14px;
        text-align: center;
        text-transform: uppercase;
      }

      .status.ok {
        background: var(--ok);
      }

      .status.warn {
        background: var(--warn);
      }

      .status.err {
        background: var(--err);
      }

      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .metric,
      .event-log {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }

      .metric span,
      .event-log span {
        color: var(--muted);
        display: block;
        font-size: 13px;
        margin-bottom: 10px;
      }

      .metric strong {
        display: block;
        font-size: 30px;
        line-height: 1;
      }

      .meta {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin: 18px 0;
      }

      .event-log {
        margin-top: 14px;
      }

      pre {
        margin: 0;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
      }

      @media (max-width: 800px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>ECOMILE Dashboard</h1>
          <div class="meta">
            <span id="device">Device: -</span>
            <span id="sessionText">Session: dashboard_live</span>
            <span id="updated">Updated: -</span>
          </div>
        </div>
        <div class="controls">
          <select id="mode">
            <option value="normal">Normal</option>
            <option value="overheat">Overheat</option>
            <option value="low_battery">Low battery</option>
            <option value="sensor_error">Sensor error</option>
          </select>
          <input id="session" value="dashboard_live" aria-label="Session" />
          <div id="status" class="status ok">ok</div>
        </div>
      </header>

      <section class="grid">
        <div class="metric">
          <span>Current</span>
          <strong id="current">- A</strong>
        </div>
        <div class="metric">
          <span>Temperature</span>
          <strong id="temp">- C</strong>
        </div>
        <div class="metric">
          <span>Speed</span>
          <strong id="speed">- rpm</strong>
        </div>
        <div class="metric">
          <span>Battery</span>
          <strong id="battery">- V</strong>
        </div>
      </section>

      <section class="event-log">
        <span>Live packet</span>
        <pre id="packet">{}</pre>
      </section>
    </main>

    <script>
      const elements = {
        battery: document.querySelector("#battery"),
        current: document.querySelector("#current"),
        device: document.querySelector("#device"),
        mode: document.querySelector("#mode"),
        packet: document.querySelector("#packet"),
        session: document.querySelector("#session"),
        sessionText: document.querySelector("#sessionText"),
        speed: document.querySelector("#speed"),
        status: document.querySelector("#status"),
        temp: document.querySelector("#temp"),
        updated: document.querySelector("#updated"),
      };

      let stream;

      function formatValue(value, suffix) {
        return value === null || value === undefined ? `- ${suffix}` : `${value} ${suffix}`;
      }

      function render(packet) {
        elements.current.textContent = formatValue(packet.data.current_A, "A");
        elements.temp.textContent = formatValue(packet.data.temp_C, "C");
        elements.speed.textContent = formatValue(packet.data.speed_rpm, "rpm");
        elements.battery.textContent = formatValue(packet.data.battery_V, "V");
        elements.device.textContent = `Device: ${packet.device_id}`;
        elements.sessionText.textContent = `Session: ${packet.session}`;
        elements.updated.textContent = `Updated: ${new Date(packet.timestamp).toLocaleTimeString()}`;
        elements.status.className = `status ${packet.status}`;
        elements.status.textContent = packet.status;
        elements.packet.textContent = JSON.stringify(packet, null, 2);
      }

      function connect() {
        if (stream) stream.close();

        const params = new URLSearchParams({
          mode: elements.mode.value,
          session: elements.session.value || "dashboard_live",
        });

        stream = new EventSource(`/api/telemetry/stream?${params}`);
        stream.onmessage = (event) => render(JSON.parse(event.data));
      }

      elements.mode.addEventListener("change", connect);
      elements.session.addEventListener("change", connect);
      connect();
    </script>
  </body>
</html>
